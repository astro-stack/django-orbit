name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Confirm annotated tag is on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          git fetch origin main
          RELEASE_COMMIT="$(git rev-parse "$RELEASE_TAG^{}")"
          git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/main"

      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Verify release metadata
        run: python scripts/verify_release.py --metadata-only --tag "${{ github.ref_name }}"

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

  create-release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi

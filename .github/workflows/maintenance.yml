name: Scheduled maintenance

on:
  schedule:
    - cron: "17 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: scheduled-maintenance
  cancel-in-progress: true

jobs:
  health:
    name: Repository health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and release tools
        id: install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine pip-audit

      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m pytest --tb=short -q

      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: python -m pip_audit

      - name: Validate package metadata
        id: package
        continue-on-error: true
        run: |
          python scripts/verify_release.py --metadata-only
          python -m build
          python -m twine check dist/*

      - name: Validate documentation
        id: docs
        continue-on-error: true
        run: |
          python -m pip install mkdocs-material mkdocs-minify-plugin
          python -m mkdocs build --strict

      - name: Publish health summary
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
        run: |
          {
            echo "## Scheduled maintenance"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Install | ${INSTALL_OUTCOME} |"
            echo "| Tests | ${TESTS_OUTCOME} |"
            echo "| Dependency audit | ${AUDIT_OUTCOME} |"
            echo "| Package metadata/build | ${PACKAGE_OUTCOME} |"
            echo "| Documentation | ${DOCS_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failures
        if: always() && (steps.install.outcome != 'success' || steps.tests.outcome != 'success' || steps.audit.outcome != 'success' || steps.package.outcome != 'success' || steps.docs.outcome != 'success')
        uses: actions/github-script@v7
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
        with:
          script: |
            const title = "Scheduled maintenance failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled repository health check found a failure.",
              "",
              `Run: ${runUrl}`,
              "",
              "| Check | Result |",
              "| --- | --- |",
              `| Install | ${process.env.INSTALL_OUTCOME} |`,
              `| Tests | ${process.env.TESTS_OUTCOME} |`,
              `| Dependency audit | ${process.env.AUDIT_OUTCOME} |`,
              `| Package metadata/build | ${process.env.PACKAGE_OUTCOME} |`,
              `| Documentation | ${process.env.DOCS_OUTCOME} |`,
              "",
              "This report is informational. It does not modify code, push branches or merge pull requests."
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Fail when health checks fail
        if: steps.install.outcome != 'success' || steps.tests.outcome != 'success' || steps.audit.outcome != 'success' || steps.package.outcome != 'success' || steps.docs.outcome != 'success'
        run: exit 1

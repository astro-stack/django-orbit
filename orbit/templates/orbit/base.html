{% load static %}<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Orbit{% endblock %}</title>
    
    <!-- Styles: compiled Tailwind CSS + Orbit design system + self-hosted fonts
         (built from frontend/, see CONTRIBUTING.md) -->
    <link rel="stylesheet" href="{% static 'orbit/css/orbit.css' %}">

    <!-- HTMX -->
    <script src="{% static 'orbit/vendor/htmx.min.js' %}"></script>

    <!-- Alpine.js (+ collapse plugin for smooth nav group toggles) -->
    <script defer src="{% static 'orbit/vendor/alpine-collapse.min.js' %}"></script>
    <script defer src="{% static 'orbit/vendor/alpine.min.js' %}"></script>

    <!-- Lucide Icons (subset bundle of the icons Orbit uses) -->
    <script src="{% static 'orbit/vendor/lucide.min.js' %}"></script>

    {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-orbit-bg-primary text-orbit-text-primary font-sans antialiased">
    {% block body %}{% endblock %}
    
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Re-initialize icons after HTMX swaps
        document.body.addEventListener('htmx:afterSwap', function(event) {
            lucide.createIcons();
        });
        
        // JSON syntax highlighting function
        function syntaxHighlight(json) {
            if (typeof json !== 'string') {
                json = JSON.stringify(json, null, 2);
            }
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        async function copyElement(button) {
            const target = document.getElementById(button.dataset.copyTarget);

            if (!target || button.disabled) {
                return;
            }

            button.disabled = true;

            try {
                await navigator.clipboard.writeText(target.textContent.trim());

                const original = button.innerHTML;

                button.innerHTML = `
                    <span class="flex items-center gap-1 text-emerald-400 text-xs">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        Copied
                    </span>
                `;

                lucide.createIcons();

                setTimeout(() => {
                    button.innerHTML = original;
                    button.disabled = false;
                    lucide.createIcons();
                }, 1500);

            } catch (err) {
                button.disabled = false;
                console.error("Failed to copy:", err);
            }
        }

        async function copyTextWithFallback(text) {
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    return;
                } catch (error) {
                    // Browser permissions can reject the API even in a secure context.
                }
            }

            const previousFocus = document.activeElement;
            const fallback = document.createElement("textarea");
            fallback.value = text;
            fallback.setAttribute("readonly", "");
            fallback.className = "fixed -left-full top-0 opacity-0";
            document.body.appendChild(fallback);
            fallback.select();

            let copied = false;
            try {
                copied = document.execCommand("copy");
            } finally {
                fallback.remove();
                if (previousFocus && typeof previousFocus.focus === "function") {
                    previousFocus.focus({preventScroll: true});
                }
            }

            if (!copied) {
                throw new Error("Clipboard access is unavailable");
            }
        }

        async function copyRemoteText(button) {
            const url = button.dataset.agentHandoffUrl;
            const original = button.innerHTML;

            if (!url || button.disabled) {
                return;
            }

            button.disabled = true;

            try {
                const response = await fetch(url, {headers: {Accept: "text/plain"}});
                const text = await response.text();

                if (!response.ok) {
                    throw new Error("Could not build handoff");
                }

                await copyTextWithFallback(text);
                button.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i><span>Fix handoff copied</span>';
            } catch (error) {
                button.innerHTML = '<i data-lucide="alert-triangle" class="w-4 h-4"></i><span>Copy failed; use Preview handoff</span>';
                console.error("Failed to copy Orbit handoff:", error);
            } finally {
                lucide.createIcons();
                setTimeout(() => {
                    button.innerHTML = original;
                    button.disabled = false;
                    lucide.createIcons();
                }, 1800);
            }
        }

        document.addEventListener("click", (event) => {
            const target = event.target instanceof Element ? event.target : null;
            if (!target) {
                return;
            }

            const handoffButton = target.closest(".orbit-copy-remote-btn");

            if (handoffButton) {
                copyRemoteText(handoffButton);
                return;
            }

            const button = target.closest(".orbit-copy-btn");

            if (!button) {
                return;
            }

            copyElement(button);
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
